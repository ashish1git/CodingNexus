upstream codingnexus_app {
    server 127.0.0.1:3000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Static files — Nginx serves from disk (not proxied to Express)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /home/apsit/projects/codingnexus/Mcodingnexus/dist_nginx;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Docs
    location ^~ /docs {
        root /home/apsit/projects/codingnexus/Mcodingnexus/dist_nginx;
        try_files $uri $uri/ /docs/index.html;
    }

    # API calls → Express
    location /api/ {
        proxy_pass http://codingnexus_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Everything else → Express (SPA fallback)
    location / {
        proxy_pass http://codingnexus_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
