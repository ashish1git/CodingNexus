events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Main application — port 3000
    upstream codingnexus_app {
        server 127.0.0.1:3000;
    }

    # Competition microservice — port 3001
    upstream competition_service {
        server 127.0.0.1:3001;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Static files — Nginx serves from disk (not proxied to Express)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /home/apsit/projects/codingnexus/Mcodingnexus/dist_nginx;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Docs
        location ^~ /docs {
            root /home/apsit/projects/codingnexus/Mcodingnexus/dist_nginx;
            try_files $uri $uri/ /docs/index.html;
        }

        # Competition microservice — must be BEFORE the generic /api/ block
        location /api/competitions {
            proxy_pass http://competition_service;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # All other API calls → Main Express app (port 3000)
        location /api/ {
            proxy_pass http://codingnexus_app;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Everything else → Express (SPA fallback)
        location / {
            proxy_pass http://codingnexus_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }
}
