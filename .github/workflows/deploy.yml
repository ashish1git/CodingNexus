# ==============================
# CD — Build, Push to GHCR, Deploy to Production
# ==============================
#
# Phase 1 (build-push): GitHub Actions builds Docker image → pushes to GHCR
# Phase 2 (deploy): SSH into server → pull image from GHCR → restart container
#
# Benefits:
#   - Server never builds (10x faster deploy)
#   - Image always available at ghcr.io/ashish1git/codingnexus
#   - New devs: docker pull + up in 30 seconds (no 4-min build)
# ==============================

name: Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  build-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ashish1git/codingnexus:latest
            ghcr.io/ashish1git/codingnexus:${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
            VITE_CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME || 'dtxktmolj' }}
            VITE_CLOUDINARY_UPLOAD_PRESET=profile_photos
            VITE_CLOUDINARY_NOTES_PRESET=codingnexus_notes
            VITE_MAINTENANCE_MODE=${{ secrets.VITE_MAINTENANCE_MODE || 'false' }}

  deploy:
    name: Deploy to Production Server
    needs: build-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            cd ${{ secrets.APP_DIR }}

            # ── Pull latest code (for env files + docker-compose) ──
            git fetch origin main
            git reset --hard origin/main

            # ── Login to GHCR ────────────────────────────────────
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true

            # ── Write .env.docker from GitHub Secrets ─────────────
            cat > .env.docker << 'ENVEOF'
            NODE_ENV=production
            PORT=3000
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=7d
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            JUDGE0_URL=http://localhost:2358
            VITE_JUDGE0_URL=http://localhost:2358
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            VITE_CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            VITE_CLOUDINARY_UPLOAD_PRESET=profile_photos
            VITE_CLOUDINARY_NOTES_PRESET=codingnexus_notes
            BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
            BREVO_API_KEY_SECONDARY=${{ secrets.BREVO_API_KEY_SECONDARY }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            EMAIL_FROM_SECONDARY=${{ secrets.EMAIL_FROM_SECONDARY }}
            EMAIL_FROM_NAME=Coding Nexus
            EMAIL_SERVICE=brevo
            ENABLE_POLLING=false
            POLL_INTERVAL=15000
            MAINTENANCE_MODE=false
            VITE_MAINTENANCE_MODE=false
            USE_GEMINI_DIRECT=${{ secrets.USE_GEMINI_DIRECT || 'false' }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || '' }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY || '' }}
            OPENROUTER_MODEL=${{ secrets.OPENROUTER_MODEL || '' }}
            VITE_API_URL=/api
            ENVEOF

            # ── Write .env (build-time Vite vars) ─────────────────
            cat > .env << 'ENVEOF'
            VITE_API_URL=/api
            VITE_CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            VITE_CLOUDINARY_UPLOAD_PRESET=profile_photos
            VITE_CLOUDINARY_NOTES_PRESET=codingnexus_notes
            ENVEOF

            # ── Pull pre-built image from GHCR (NO local build!) ──
            echo "📦 Pulling image from GHCR..."
            docker pull ghcr.io/ashish1git/codingnexus:latest

            # ── Tag for docker compose ────────────────────────────
            docker tag ghcr.io/ashish1git/codingnexus:latest mcodingnexus-app

            # ── Zero-downtime restart ─────────────────────────────
            echo "🔄 Restarting app container..."
            docker compose stop app || true
            docker compose rm -f app || true
            docker compose up -d app

            # ── Wait for healthy ──────────────────────────────────
            echo "⏳ Waiting for container to be healthy..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect codingnexus-app --format '{{.State.Health.Status}}' 2>/dev/null || echo "creating")
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ Container healthy"
                break
              fi
              sleep 2
            done

            # ── Sync static assets to host disk for nginx ──────
            echo "📋 Syncing static assets to dist_nginx..."
            docker cp codingnexus-app:/app/dist/. dist_nginx/
            chmod -R 755 dist_nginx/

            # ── Health check ──────────────────────────────────────
            echo "🏥 Running health check..."
            curl -sf http://localhost:3000/api/health && echo "" || echo "❌ Health check failed"
            curl -sf http://localhost:2358/about > /dev/null && echo "✅ Judge0 connected" || echo "❌ Judge0 unreachable"

            # ── Show status ───────────────────────────────────────
            docker ps --format "table {{.Names}}\t{{.Status}}"

      - name: Deployment Result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployed to ${{ secrets.FRONTEND_URL }}"
          else
            echo "❌ Deployment failed — check GitHub Actions logs"
          fi
