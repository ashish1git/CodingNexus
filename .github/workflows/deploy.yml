# ==============================
# CD — Deploy codingnexus-app via Docker Compose
# ==============================
#
# Triggers:
#   Auto: push to main (excluding docs + md files)
#   Manual: workflow_dispatch from GitHub Actions tab
#
# What it does:
#   1. SSH into production server (202.179.85.68)
#   2. Pull latest code from main
#   3. Write .env.docker from GitHub Secrets (single source of runtime truth)
#   4. Build fresh Docker image
#   5. Stop old container → start new container
#   6. Health check
# ==============================

name: Deploy (Docker)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            # ── Navigate ──────────────────────────────────────
            cd ${{ secrets.APP_DIR }}

            # ── Pull latest code ──────────────────────────────
            git fetch origin main
            git reset --hard origin/main

            # ── Write .env.docker from GitHub Secrets ─────────
            # This is the SINGLE source of truth for runtime.
            # docker-compose.yml loads it via env_file.
            cat > .env.docker << 'ENVEOF'
            NODE_ENV=production
            PORT=3000
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=7d
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}

            JUDGE0_URL=http://localhost:2358
            VITE_JUDGE0_URL=http://localhost:2358

            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            VITE_CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            VITE_CLOUDINARY_UPLOAD_PRESET=profile_photos
            VITE_CLOUDINARY_NOTES_PRESET=codingnexus_notes

            BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
            BREVO_API_KEY_SECONDARY=${{ secrets.BREVO_API_KEY_SECONDARY }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            EMAIL_FROM_SECONDARY=${{ secrets.EMAIL_FROM_SECONDARY }}
            EMAIL_FROM_NAME=Coding Nexus
            EMAIL_SERVICE=brevo

            ENABLE_POLLING=false
            POLL_INTERVAL=15000
            MAINTENANCE_MODE=false
            VITE_MAINTENANCE_MODE=false

            USE_GEMINI_DIRECT=${{ secrets.USE_GEMINI_DIRECT || 'false' }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || '' }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY || '' }}
            OPENROUTER_MODEL=${{ secrets.OPENROUTER_MODEL || '' }}

            VITE_API_URL=/api
            VITE_CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            VITE_CLOUDINARY_UPLOAD_PRESET=profile_photos
            VITE_CLOUDINARY_NOTES_PRESET=codingnexus_notes
            ENVEOF

            # ── Also write .env (build-time Vite vars, non-secret) ──
            cat > .env << 'ENVEOF'
            VITE_API_URL=/api
            VITE_CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            VITE_CLOUDINARY_UPLOAD_PRESET=profile_photos
            VITE_CLOUDINARY_NOTES_PRESET=codingnexus_notes
            ENVEOF

            # ── Build fresh image ────────────────────────────
            echo "🔨 Building Docker image..."
            docker compose build --no-cache app

            # ── Zero-downtime restart ────────────────────────
            echo "🔄 Restarting app container..."
            docker compose stop app
            docker compose rm -f app
            docker compose up -d app

            # ── Wait for healthy ─────────────────────────────
            echo "⏳ Waiting for container to be healthy..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect codingnexus-app --format '{{.State.Health.Status}}' 2>/dev/null || echo "creating")
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ Container healthy"
                break
              fi
              sleep 2
            done

            # ── Health check ─────────────────────────────────
            echo "🏥 Running health check..."
            curl -sf http://localhost:3000/api/health && echo "" || echo "❌ Health check failed"

            # ── Judge0 check ─────────────────────────────────
            curl -sf http://localhost:2358/about > /dev/null && echo "✅ Judge0 connected" || echo "❌ Judge0 unreachable"

            # ── Show status ──────────────────────────────────
            docker ps --format "table {{.Names}}\t{{.Status}}"

      - name: Deployment Result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployed to ${{ secrets.FRONTEND_URL }}"
          else
            echo "❌ Deployment failed — check GitHub Actions logs"
          fi
