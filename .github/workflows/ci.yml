# ==============================
# CI — Build, Lint, and Audit
# ==============================
#
# Runs on: every push + every pull request to main
# Catches broken code BEFORE it reaches production.
#
# Build order:
#   1. Build Docs (Docusaurus) → docs/build/
#   2. Build Frontend (Vite)   → dist/  (vite.config.js copies docs/build → dist/docs/)
# ==============================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build + Lint + Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint
        continue-on-error: true

      # ── Must run BEFORE vite build so copy-docs-build plugin in vite.config.js
      # ── can copy docs/build/ → dist/docs/. Without this step docs were missing.
      - name: Build Docs (Docusaurus)
        run: npm run build-docs

      - name: Build frontend (Vite)
        run: npm run build

      - name: Security audit (warn only)
        run: npm audit --omit=dev --audit-level=moderate || true
