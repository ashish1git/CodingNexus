# ==============================
# CI — Build, Lint, and Audit
# ==============================
#
# Runs on: every push + every pull request to main
# Catches broken code BEFORE it reaches production.
# ==============================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build + Lint + Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        run: npm run build

      - name: Security audit
        run: npm audit --omit=dev --audit-level=moderate
        continue-on-error: true
