# ==============================
# Coding Nexus — Local Development (Infrastructure Only)
# ==============================
#
# This runs ONLY the services your app depends on:
#   PostgreSQL + Judge0 + Redis
#
# The app itself runs natively on your machine via:
#   npm run dev:all   (starts Vite + Express with hot-reload)
#
# Why: code changes reflect instantly (hot reload), no Docker rebuild needed.
#
# For quick preview of production build:
#   docker pull ghcr.io/ashish1git/codingnexus:latest
#   docker run -p 3000:3000 --env-file .env.local ghcr.io/ashish1git/codingnexus:latest
# ==============================

services:

  # ── PostgreSQL Database ─────────────────
  db:
    image: postgres:15
    container_name: codingnexus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sumit
      POSTGRES_PASSWORD: sumit123
      POSTGRES_DB: sumitdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ── Judge0 Code Execution Engine ────────
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: codingnexus-judge0-server
    restart: unless-stopped
    ports:
      - "2358:2358"
    privileged: true
    volumes:
      - ./judge0/judge0-v1.13.1/judge0.conf:/judge0.conf:ro

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: codingnexus-judge0-workers
    command: ["./scripts/workers"]
    restart: unless-stopped
    privileged: true
    volumes:
      - ./judge0/judge0-v1.13.1/judge0.conf:/judge0.conf:ro

  judge0-db:
    image: postgres:16.2
    container_name: codingnexus-judge0-db
    restart: unless-stopped
    volumes:
      - j0pgdata:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0pass
      POSTGRES_DB: judge0

  judge0-redis:
    image: redis:7.2.4
    container_name: codingnexus-judge0-redis
    restart: unless-stopped
    command:
      - "bash"
      - "-c"
      - 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: judge0pass

volumes:
  pgdata:
  j0pgdata:
