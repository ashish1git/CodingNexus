# ==============================
# Coding Nexus — Docker Compose Configuration
# ==============================
# 
# ENVIRONMENT VARIABLE FLOW:
#   .env.example → copy to .env → docker-compose auto-reads for build args
#   .env.docker  → loaded into container at runtime via env_file
#
# NEVER export secrets in shell — docker-compose prioritizes shell over files.
# All critical values live in .env.docker only.
# ==============================

services:

  app:
    image: mcodingnexus-app:latest
    # Image is built by GitHub Actions and tagged as mcodingnexus-app:latest
    # on the production server. To build manually:
    #   docker compose build app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_CLOUDINARY_CLOUD_NAME=${VITE_CLOUDINARY_CLOUD_NAME:-dtxktmolj}
        - VITE_CLOUDINARY_UPLOAD_PRESET=${VITE_CLOUDINARY_UPLOAD_PRESET:-profile_photos}
        - VITE_CLOUDINARY_NOTES_PRESET=${VITE_CLOUDINARY_NOTES_PRESET:-codingnexus_notes}
        - VITE_MAINTENANCE_MODE=${VITE_MAINTENANCE_MODE:-false}

    container_name: codingnexus-app
    restart: unless-stopped
    network_mode: "host"
    user: root

    # All runtime environment comes from this file
    env_file:
      - .env.docker

    # Only safe, non-secret defaults that can be safely overridden
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./server/dsa-codes.json:/app/server/dsa-codes.json

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Competition Microservice ──────────────────────────────────────────────────
  # Handles all /api/competitions/* traffic.
  # Nginx routes those requests here (port 3001) instead of the main app.
  competition-service:
    image: codingnexus-competition:latest
    build:
      context: ./competition-service
      dockerfile: Dockerfile

    container_name: codingnexus-competition
    restart: unless-stopped
    network_mode: "host"

    # Reads DATABASE_URL, JWT_SECRET, JUDGE0_URL from the same env file as main app
    env_file:
      - .env.docker

    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3001

    depends_on:
      app:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: codingnexus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
      - competition-service
    profiles:
      - with-nginx

volumes:
  postgres_data:
     driver: local

networks:
  default:
    name: codingnexus-network

